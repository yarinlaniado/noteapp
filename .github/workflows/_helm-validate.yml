name: Helm validate

on:
  workflow_call: {}

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: [helm/application/noteapp, helm/platform-ttl-cronjob]
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4

      - run: helm lint ${{ matrix.chart }}
      - run: helm template test-release ${{ matrix.chart }} --namespace test > /dev/null

  validate-argocd-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate YAML syntax
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'EOF'
          import glob, sys, yaml
          failed = False
          for f in glob.glob('argocd/**/*.yaml', recursive=True):
              try:
                  list(yaml.safe_load_all(open(f)))
              except yaml.YAMLError as e:
                  print(f"INVALID: {f}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          EOF
