{% extends "layout.html" %}
{% block body %}
    <div class="container">
        <div class="content-card">
            <h1>Delete Note &mdash; {{ title }}</h1>
            <div class="delete-warning">This action cannot be undone. The note will be permanently removed.</div>
            <form method="POST" class="d-flex" style="gap: 0.75rem;">
                <button type="submit" class="btn btn-delete">Delete</button>
                <a href="{{ url_for('main') }}" class="btn btn-view">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
