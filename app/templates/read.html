{% extends "layout.html" %}
{% block body %}
    <div class="container">
        <div class="content-card note-detail">
            <a href="{{ url_for('main') }}" class="back-link">&larr; Back to Notes</a>
            <h1>{{ title }}</h1>
            {% if image_url %}
                <img src="{{ image_url }}" alt="{{ title }}" class="note-detail-image">
            {% endif %}
            <p class="note-detail-content">{{ content }}</p>
        </div>
    </div>
{% endblock %}
