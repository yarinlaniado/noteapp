apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ephemeral-envs
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/yarinlaniado/noteapp.git
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Nothing else cluster-scoped is allowed: a broken or malicious branch
  # deploy stays contained to its own namespace.
