apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: main
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/yarinlaniado/noteapp.git
    - https://prometheus-community.github.io/helm-charts
    - https://kubernetes.github.io/autoscaler
  destinations:
    - namespace: noteapp
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: platform-jobs
      server: https://kubernetes.default.svc
    - namespace: kube-system # cluster-autoscaler only — the LB controller is Terraform-bootstrapped, not ArgoCD-managed
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "admissionregistration.k8s.io"
      kind: MutatingWebhookConfiguration
    - group: "admissionregistration.k8s.io"
      kind: ValidatingWebhookConfiguration
  # Every app here is a trusted, first-party chart, unlike ephemeral-envs.yaml
  # (the untrusted-branch boundary), which stays Namespace-only.
