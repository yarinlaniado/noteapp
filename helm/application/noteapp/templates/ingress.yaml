{{- if not .Values.ephemeral.enabled }}
# Only main is ever exposed via the shared ALB — ephemeral environments have
# no public URL at all, reachable only via `kubectl port-forward`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: noteapp
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: noteapp-shared
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]' # no ACM cert without an owned domain (confirmed decision)
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: noteapp
                port:
                  number: 8000
{{- end }}
