apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: noteapp
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Every environment's Ingress joins this same group — one shared ALB
    # total instead of one per environment. Lower groupOrder is evaluated
    # first, so ephemeral envs (specific path prefixes) must sort before
    # main's catch-all "/".
    alb.ingress.kubernetes.io/group.name: noteapp-shared
    alb.ingress.kubernetes.io/group.order: {{ .Values.ingress.groupOrder | quote }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]' # no ACM cert without an owned domain (confirmed decision)
spec:
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.pathPrefix }}
            pathType: Prefix
            backend:
              service:
                name: noteapp
                port:
                  number: 8000
