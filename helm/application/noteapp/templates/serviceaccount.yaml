apiVersion: v1
kind: ServiceAccount
metadata:
  # Fixed name across every namespace this chart is deployed into — required
  # for the IRSA trust-policy conditions in terraform/eks/irsa.tf to match
  # (system:serviceaccount:noteapp:noteapp for prod,
  # system:serviceaccount:*:noteapp for non-prod).
  name: noteapp
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
